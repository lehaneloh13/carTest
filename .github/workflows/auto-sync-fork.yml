name: Auto-sync fork with upstream (salavey13/carTest)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork branch main from upstream
        run: gh repo sync ${{ github.repository }} --branch main
        env:
          GH_TOKEN: ${{ github.token }}
